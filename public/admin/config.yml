backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME # TODO: update after you push this project to GitHub
  branch: main
  base_url: https://YOUR-DEPLOYED-DOMAIN # TODO: update to your live Vercel/production URL
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/pages/home.md"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Stat 1 Value", name: "stat1Value", widget: "string" }
          - { label: "Stat 1 Label", name: "stat1Label", widget: "string" }
          - { label: "Stat 2 Value", name: "stat2Value", widget: "string" }
          - { label: "Stat 2 Label", name: "stat2Label", widget: "string" }
          - { label: "Stat 3 Value", name: "stat3Value", widget: "string" }
          - { label: "Stat 3 Label", name: "stat3Label", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/about.md"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Registration Box Title", name: "regTitle", widget: "string" }
          - { label: "Registration Box Text", name: "regBody", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/our-work.md"
        label: "Our Work Page"
        name: "our-work"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Achievements Section Title", name: "achievementsTitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/get-involved.md"
        label: "Get Involved Page"
        name: "get-involved"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "news"
    label: "News & Press"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Image (optional)", name: "image", widget: "image", required: false }
      - { label: "PDF (optional)", name: "pdf", widget: "file", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "learn-more"
    label: "Learn More"
    folder: "content/learn-more"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Teaser (shown on hub card)", name: "teaser", widget: "text" }
      - { label: "Order", name: "order", widget: "number", default: 99 }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/site.json"
        label: "Organization Info"
        name: "site"
        fields:
          - { label: "Organization Name", name: "orgName", widget: "string" }
          - { label: "Short Name", name: "shortName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "CVR / Registration", name: "cvr", widget: "string" }
          - { label: "Founded Note", name: "founded", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Twitter / X", name: "twitter", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "Facebook", name: "facebook", widget: "string" }
          - label: "Navigation"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }

      - file: "content/pillars.json"
        label: "How We Work (3 Pillars)"
        name: "pillars"
        fields:
          - label: "Pillars"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Short Summary", name: "summary", widget: "text" }
              - { label: "Full Description", name: "body", widget: "text" }

      - file: "content/achievements.json"
        label: "Impact / Achievements"
        name: "achievements"
        fields:
          - label: "Achievements"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      - file: "content/ways-to-help.json"
        label: "Ways to Help"
        name: "ways-to-help"
        fields:
          - label: "Ways to Help"
            name: "items"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }

      - file: "content/milestones.json"
        label: "History / Milestones"
        name: "milestones"
        fields:
          - label: "Milestones"
            name: "items"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
