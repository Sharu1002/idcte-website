  # --------------------------------------------------------------- SETTINGS --
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/site.json"
        label: "Organization Info (English)"
        name: "site"
        fields:
          - { label: "Organization Name", name: "orgName", widget: "string" }
          - { label: "Short Name", name: "shortName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "CVR / Registration", name: "cvr", widget: "string" }
          - { label: "Founded Note", name: "founded", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Twitter / X", name: "twitter", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
              - { label: "Facebook", name: "facebook", widget: "string" }
          - label: "Navigation"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Link", name: "href", widget: "string" }

      - file: "content/site.ta.json"
        label: "Organization Info (Tamil)"
        name: "site_ta"
        fields:
          - { label: "Organization Name", name: "orgName", widget: "string" }
