backend:
  name: github
  repo: Sharu1002/idcte-website
  branch: main
  auth_endpoint: api/auth
  # base_url is injected at runtime in index.html from window.location.origin,
  # so this works on localhost, Vercel previews, and the live domain alike.

publish_mode: simple
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # ---------------------------------------------------------------- ENGLISH --
  - name: "pages"
    label: "Pages (English)"
    files:
      - file: "content/pages/home.md"
        label: "Home Page"
        name: "home"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Stat 1 Value", name: "stat1Value", widget: "string" }
          - { label: "Stat 1 Label", name: "stat1Label", widget: "string" }
          - { label: "Stat 2 Value", name: "stat2Value", widget: "string" }
          - { label: "Stat 2 Label", name: "stat2Label", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/about.md"
        label: "About Page"
        name: "about"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Registration Box Title", name: "regTitle", widget: "string" }
          - { label: "Registration Box Text", name: "regBody", widget: "text" }
          - { label: "Why We Exist (pull quote)", name: "whyWeExist", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/our-work.md"
        label: "Our Work Page"
        name: "our-work"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Achievements Section Title", name: "achievementsTitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/get-involved.md"
        label: "Get Involved Page"
        name: "get-involved"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Hero Image", name: "heroImage", widget: "image" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }

      - file: "content/pages/donate.md"
        label: "Donate Page"
        name: "donate"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog"
    label: "Blog (English)"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    filter: { field: "lang", value: "en" }
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Title", name: "title", widget: "string" }
      - label: "Published Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - { label: "Summary (shown on the blog list card)", name: "summary", widget: "text" }
      - { label: "Main Image", name: "image", widget: "image", required: false }
      - label: "Photos (adds a gallery at the end of the post)"
        name: "photos"
        widget: "list"
        required: false
        fields:
          - { label: "Photo", name: "src", widget: "image" }
          - { label: "Caption (optional)", name: "caption", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "news"
    label: "News & Press (English)"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    filter: { field: "lang", value: "en" }
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Title", name: "title", widget: "string" }
      - label: "Published Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Image (optional)", name: "image", widget: "image", required: false }
      - { label: "PDF (optional)", name: "pdf", widget: "file", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "learn-more"
    label: "Learn More (English)"
    folder: "content/learn-more"
    create: true
    filter: { field: "lang", value: "en" }
    summary: "{{order}}. {{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Language", name: "lang", widget: "hidden", default: "en" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Teaser (shown on hub card)", name: "teaser", widget: "text" }
      - { label: "Order", name: "order", widget: "number", default: 99 }
      - { label: "Body", name: "body", widget: "markdown" }

  # ------------------------------------------------------------------ TAMIL --
  - name: "pages_ta"
    label: "பக்கங்கள் (Tamil)"
    files:
      - file: "content/pages/home.ta.md"
